name: GDScript checks
on: [push, pull_request]

jobs:
  gdscript-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install "gdtoolkit==4.*"
      - run: gdformat --check scripts/
      - run: gdlint scripts/
